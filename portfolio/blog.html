<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog | Mahmoud Osama</title>
    <meta name="description" content="Technical articles on AI engineering, backend development, security, and career insights by Mahmoud Osama.">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/rtl.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script src="js/i18n.js"></script>
    <style>
        /* Blog page specific styles */
        .blog-hero {
            padding: 120px 0 60px;
            text-align: center;
        }
        .blog-hero h1 {
            font-size: 42px;
            font-weight: 800;
            letter-spacing: -0.03em;
            color: var(--text);
            margin-bottom: 12px;
        }
        .blog-hero p {
            color: var(--text-secondary);
            font-size: 18px;
            max-width: 560px;
            margin: 0 auto;
        }
        .blog-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 28px;
            padding-bottom: 80px;
        }
        .blog-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            overflow: hidden;
            transition: var(--transition);
            display: flex;
            flex-direction: column;
            text-decoration: none;
            color: inherit;
        }
        .blog-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 32px var(--shadow);
            border-color: var(--primary);
        }
        .blog-card-cover {
            width: 100%;
            height: 200px;
            background: linear-gradient(135deg, rgba(79, 70, 229, 0.08), rgba(129, 140, 248, 0.15));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
            color: var(--primary);
        }
        .blog-card-cover img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .blog-card-body {
            padding: 24px;
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        .blog-card-meta {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 12px;
            font-size: 13px;
            color: var(--text-secondary);
        }
        .blog-card-meta .blog-date {
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .blog-card-meta .blog-lang-badge {
            font-size: 11px;
            font-weight: 700;
            padding: 2px 8px;
            border-radius: 6px;
            background: rgba(79, 70, 229, 0.1);
            color: var(--primary);
            text-transform: uppercase;
        }
        .blog-card-title {
            font-size: 20px;
            font-weight: 700;
            color: var(--text);
            margin-bottom: 10px;
            letter-spacing: -0.01em;
            line-height: 1.4;
        }
        .blog-card-excerpt {
            font-size: 14px;
            color: var(--text-secondary);
            line-height: 1.6;
            flex: 1;
        }
        .blog-card-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 16px;
        }
        .blog-card-tags span {
            font-family: var(--font-mono);
            font-size: 12px;
            padding: 3px 10px;
            background: var(--bg-alt);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text-secondary);
        }
        .blog-card-read {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-top: 18px;
            font-size: 14px;
            font-weight: 600;
            color: var(--primary);
        }
        .blog-card-read i {
            transition: transform 0.2s ease;
        }
        .blog-card:hover .blog-card-read i {
            transform: translateX(4px);
        }
        .blog-empty {
            grid-column: 1 / -1;
            text-align: center;
            padding: 60px 20px;
            color: var(--text-secondary);
            font-size: 16px;
        }
        .blog-back {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            transition: var(--transition);
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 1000;
            background: var(--card-bg);
            padding: 8px 16px;
            border-radius: 10px;
            border: 1px solid var(--border);
            box-shadow: 0 2px 8px var(--shadow);
        }
        .blog-back:hover {
            color: var(--primary);
            border-color: var(--primary);
        }
        body.rtl .blog-back {
            left: auto;
            right: 20px;
        }
        body.rtl .blog-card-read i {
            transform: scaleX(-1);
        }
        body.rtl .blog-card:hover .blog-card-read i {
            transform: scaleX(-1) translateX(4px);
        }
        @media screen and (max-width: 768px) {
            .blog-grid { grid-template-columns: 1fr; }
            .blog-hero h1 { font-size: 32px; }
        }
    </style>
</head>
<body>
    <a href="index.html" class="blog-back" id="blogBackBtn">
        <i class="fas fa-arrow-left"></i> <span data-i18n="blog_back">Back to Portfolio</span>
    </a>

    <div class="container">
        <div class="blog-hero">
            <span class="section-tag" data-i18n="blog_tag">Writing</span>
            <h1 data-i18n="blog_title">Blog</h1>
            <p data-i18n="blog_subtitle">Technical articles, career insights, and things I've learned building AI systems.</p>
        </div>
        <div class="blog-grid" id="blogGrid">
            <div class="blog-empty" id="blogLoading">
                <i class="fas fa-spinner fa-spin"></i> Loading posts...
            </div>
        </div>
    </div>

    <script>
    // ========================
    // Blog Post Loader
    // ========================
    (function() {
        const grid = document.getElementById('blogGrid');
        const lang = localStorage.getItem('lang') || (navigator.language.startsWith('ar') ? 'ar' : 'en');

        fetch('blogs/posts.json')
            .then(r => r.json())
            .then(posts => {
                grid.innerHTML = '';
                if (!posts.length) {
                    grid.innerHTML = '<div class="blog-empty">No posts yet.</div>';
                    return;
                }
                // Sort by date descending
                posts.sort((a, b) => new Date(b.date) - new Date(a.date));

                posts.forEach(post => {
                    const title = lang === 'ar' ? post.title_ar : post.title_en;
                    const excerpt = lang === 'ar' ? post.excerpt_ar : post.excerpt_en;
                    const readLabel = lang === 'ar' ? 'اقرأ المقال' : 'Read article';
                    const dateStr = new Date(post.date).toLocaleDateString(lang === 'ar' ? 'ar-EG' : 'en-US', {
                        year: 'numeric', month: 'short', day: 'numeric'
                    });

                    const coverHTML = post.cover
                        ? `<img src="${post.cover}" alt="${title}">`
                        : `<i class="fas fa-pen-fancy"></i>`;

                    const tagsHTML = (post.tags || []).map(t => `<span>${t}</span>`).join('');

                    const card = document.createElement('a');
                    card.href = `blogs/${post.slug}.html`;
                    card.className = 'blog-card';
                    card.innerHTML = `
                        <div class="blog-card-cover">${coverHTML}</div>
                        <div class="blog-card-body">
                            <div class="blog-card-meta">
                                <span class="blog-date"><i class="fas fa-calendar-alt"></i> ${dateStr}</span>
                                <span class="blog-lang-badge">${post.lang.toUpperCase()}</span>
                            </div>
                            <h2 class="blog-card-title">${title}</h2>
                            <p class="blog-card-excerpt">${excerpt}</p>
                            <div class="blog-card-tags">${tagsHTML}</div>
                            <span class="blog-card-read">${readLabel} <i class="fas fa-arrow-right"></i></span>
                        </div>
                    `;
                    grid.appendChild(card);
                });
            })
            .catch(() => {
                grid.innerHTML = '<div class="blog-empty">Could not load posts.</div>';
            });

        // Apply i18n
        if (typeof initI18n === 'function') {
            document.documentElement.setAttribute('lang', lang);
            document.documentElement.setAttribute('dir', lang === 'ar' ? 'rtl' : 'ltr');
            if (lang === 'ar') document.body.classList.add('rtl');
            initI18n();
        }
    })();
    </script>
</body>
</html>
